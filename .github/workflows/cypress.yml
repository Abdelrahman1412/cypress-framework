name: Cypress

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cypress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: 0
      - run: npm run typecheck

  e2e:
    name: e2e (${{ matrix.mode }}, shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mode: [live, mock]
        shard: [1, 2]
    env:
      API_MODE: ${{ matrix.mode }}
      ENABLE_TEST_ROUTES: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Cypress Cloud is not needed: each shard gets a fixed, test-count-balanced spec list.
      - name: Pick this shard's specs
        id: split
        run: node scripts/split-specs.ts ${{ matrix.shard }} 2

      - name: Cypress run
        uses: cypress-io/github-action@v7
        with:
          build: npm run build:app
          start: npm run start:demo
          wait-on: http://localhost:4173/api/health
          spec: ${{ steps.split.outputs.specs }}
          browser: chrome
          summary-title: e2e ${{ matrix.mode }} shard ${{ matrix.shard }}

      - name: List tests that passed only after a retry
        if: ${{ !cancelled() }}
        run: npm run check-flaky

      # The reporter moves videos (kept only for specs with a failed attempt) into cypress/reports/html/videos.
      - name: Upload report data, screenshots and videos
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: report-data-${{ matrix.mode }}-${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: ignore
          path: |
            cypress/reports
            cypress/screenshots
            cypress/.tmp

  component:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Cypress component tests
        uses: cypress-io/github-action@v7
        with:
          component: true
          browser: chrome
          summary-title: component
      - name: Upload component report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: component-report
          if-no-files-found: ignore
          path: |
            cypress/reports/html
            cypress/screenshots

  report:
    name: Merge e2e reports
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: 0
      - name: Download every shard's report data
        uses: actions/download-artifact@v8
        with:
          pattern: report-data-*
          path: shards
      - name: Merge shards into one HTML report per mode
        run: |
          for mode in live mock; do
            rm -rf cypress/reports/html cypress/screenshots cypress/.tmp
            rm -rf cypress/videos
            mkdir -p cypress/reports/html/.jsons cypress/screenshots cypress/videos cypress/.tmp
            # upload-artifact strips the common "cypress/" prefix, so shard folders hold reports/, screenshots/, .tmp/
            for dir in shards/report-data-$mode-*; do
              shard=$(basename "$dir")
              for f in "$dir"/reports/html/.jsons/*.json; do
                [ -e "$f" ] && cp "$f" "cypress/reports/html/.jsons/$shard-$(basename "$f")"
              done
              cp -r "$dir"/screenshots/. cypress/screenshots/ 2>/dev/null || true
              cp -r "$dir"/reports/html/videos/. cypress/videos/ 2>/dev/null || true
              cp "$dir"/.tmp/cypressMochawesomeReporterConfig.json cypress/.tmp/
            done
            npx generate-mochawesome-report --output "merged/$mode"
          done
          node scripts/check-flaky.ts 'shards/**/flaky.json'
      - uses: actions/upload-artifact@v7
        with:
          name: cypress-report
          path: merged
